<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#FFD1DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아이카츠 앙코르">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아이카츠 앙코르</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --cover:#FFD1DE; --cover-2:#F5A7C0; --cover-ink:#5A2A3C; --cover-soft:#8A4A62;
  --pink:#F5A7C0; --pink-deep:#D65E8A; --badge-bg:#FFFFFF; --toast:#D65E8A;
  --bg:#FFF2F6; --paper:#FFFFFF; --ink:#4A2634; --ink-soft:#976676;
  --pocket:#FFF7FA; --pocket-edge:#F5CFDC; --hole:#FBDCE6; --line:#F7DDE6;
  --accent:#E06A94; --accent-ink:#FFFFFF; --chip:#FDE8EF; --chip-on:#E06A94; --chip-on-ink:#FFFFFF;
  --sheen:rgba(255,255,255,.7);
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F1418; --paper:#2B1D23; --ink:#FCEBF1; --ink-soft:#CDA3B3;
    --pocket:#35242C; --pocket-edge:#4E3440; --hole:#1F1418; --line:#43303A;
    --chip:#3A2730; --chip-on:#F5A7C0; --chip-on-ink:#3A1624; --sheen:rgba(255,255,255,.12); --badge-bg:#FFF2F6;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1418; --paper:#2B1D23; --ink:#FCEBF1; --ink-soft:#CDA3B3;
  --pocket:#35242C; --pocket-edge:#4E3440; --hole:#1F1418; --line:#43303A;
  --chip:#3A2730; --chip-on:#F5A7C0; --chip-on-ink:#3A1624; --sheen:rgba(255,255,255,.12); --badge-bg:#FFF2F6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:110px}

/* cover */
.cover{background:
  radial-gradient(circle at 88% 22%, rgba(255,255,255,.9) 0 2px, transparent 3px),
  radial-gradient(circle at 76% 58%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
  radial-gradient(circle at 94% 70%, rgba(255,255,255,.85) 0 2.5px, transparent 3.5px),
  radial-gradient(120% 90% at 100% 0%, var(--cover-hi,#FFE6EE) 0%, transparent 55%),
  linear-gradient(160deg,var(--cover),var(--cover-2));
  color:var(--cover-ink);padding:22px 20px 20px 34px;position:relative;border-radius:0 0 22px 22px;overflow:hidden}
.cover::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.95) 0 6px,transparent 6px 12px)}
.cover h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0 0 12px;letter-spacing:.5px}
.cover .big{font-family:var(--display);font-size:22px}
.cover .prog-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0}
.cover .prog-line small{color:var(--cover-soft);font-size:14px}
.ribbon{height:12px;border-radius:12px;background:rgba(255,255,255,.45);border:2px solid #fff;margin:10px 0 8px;overflow:hidden}
.ribbon span{display:block;height:100%;width:0;border-radius:10px;
  background:#fff;transition:width .4s ease}
.cover .sub{margin:0;color:var(--cover-soft);font-size:14px}

/* controls */
.controls{padding:16px 16px 4px;display:grid;gap:10px}
.label{font-size:13px;color:var(--ink-soft);margin:0 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 2px;font-size:14px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--pink-deep);box-shadow:0 1px 3px rgba(150,60,90,.18);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip.filter{margin-left:auto}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;margin-left:4px;padding:0 5px}

/* binder sections */
.section{margin-top:18px}
.tab{display:flex;align-items:center;gap:10px;margin:0 16px;padding:8px 14px 8px 12px;
  background:var(--paper);border-radius:12px 12px 0 0;border:1px solid var(--line);border-bottom:0;width:max-content;max-width:calc(100% - 32px)}
.tab::before{content:"";width:6px;align-self:stretch;border-radius:3px;background:var(--tabc,#D8347F)}
.tab h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0;white-space:nowrap}
.tab .count{font-size:14px;color:var(--ink-soft);white-space:nowrap}
.tab .mini{width:48px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tab .mini i{display:block;height:100%;background:var(--tabc,#D8347F)}
.pages{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scroll-padding-inline:16px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;background-color:var(--paper);
  background-image:
    radial-gradient(circle at 15px 16%,var(--hole) 6px,transparent 7px),
    radial-gradient(circle at 15px 50%,var(--hole) 6px,transparent 7px),
    radial-gradient(circle at 15px 84%,var(--hole) 6px,transparent 7px);
  border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:12px 12px 12px 32px;
  box-shadow:0 2px 0 var(--line),0 6px 18px rgba(214,94,138,.08)}
.pages .page:not(:first-child){border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.layout-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg.seg3{grid-template-columns:repeat(3,auto);padding:3px}
.seg.seg3 button{padding:6px 12px;font-family:var(--display);font-size:15px}
.n3 .grid{grid-template-columns:repeat(3,1fr);gap:8px}
.n3 .pocket{padding:4px}
.n3 .cap{font-size:11px;padding:10px 5px 4px}
.n3 .rar{font-size:11px;padding:3px 5px 2px;top:4px;left:4px}
.n3 .qty{font-size:12px;padding:3px 6px 2px;top:4px;right:4px;border-width:1.5px}
.n4 .grid{grid-template-columns:repeat(4,1fr);gap:5px}
.n4 .page{padding:10px 8px 10px 28px}
.n4 .pocket{padding:3px;border-radius:6px}
.n4 .pocket::after{border-radius:6px}
.n4 .cap{display:none}
.n4 .rar{font-size:9px;padding:2px 3px 1px;top:3px;left:3px;border-radius:4px}
.n4 .qty{font-size:10px;padding:2px 4px 1px;top:3px;right:3px;border-width:1px;border-radius:6px}
.n4 .art svg{width:74%}
.notice{margin:14px 16px 0;padding:12px 14px;border-radius:14px;background:#FFF;border:2px solid var(--pink);color:var(--ink);font-size:14px}
.art .deco{fill:var(--tc)}
.dname{display:flex;align-items:center;gap:8px}
.art.nic{flex:0 0 34px;width:34px;height:34px;background:none;display:inline-grid;place-items:center}
.art.nic svg{width:100%}
.tab .tlogo{height:22px;max-width:60px;object-fit:contain}
.tag.btag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line)}
.tag.btag img{height:14px;max-width:40px;object-fit:contain}
.flabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.flabel label{margin:0}
.linkbtn{border:0;background:none;color:var(--pink-deep);font-size:13px;text-decoration:underline;padding:2px}
.chip.bchip{display:inline-flex;align-items:center;gap:6px}
.chip.bchip img{height:18px;max-width:44px;object-fit:contain;background:#fff;border-radius:4px}
.brand-add{display:flex;gap:8px;margin-bottom:12px}
.brand-add input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;min-width:0}
.blist{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.blogo{width:56px;height:56px;border-radius:12px;border:1.5px dashed var(--pocket-edge);background:#fff;font-size:11px;line-height:1.3;color:var(--ink-soft);display:grid;place-items:center;padding:4px;overflow:hidden}
.blogo img{max-width:100%;max-height:100%;object-fit:contain}
.bmeta{display:flex;flex-direction:column;min-width:0}
.bmeta strong{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmeta small{color:var(--ink-soft);font-size:12px}
.bmeta .bren{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px;background:var(--bg);width:100%}
.bacts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.bacts button{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 10px;font-size:13px}
.bacts button.arm{background:#C0265E;color:#fff;border-color:#C0265E}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:none;stroke:var(--pink-deep);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;border:1.5px solid var(--pocket-edge);background:var(--paper);border-radius:14px;padding:10px 12px 10px 38px;font-size:16px}
.search input:focus{border-color:var(--pink)}
.search-sum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 16px 0;padding:10px 12px 10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;font-size:14px}
.search-sum button{border:0;background:var(--chip);border-radius:9px;padding:5px 10px;font-size:13px;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.sw span{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border-color:var(--pink-deep);box-shadow:0 0 0 2px var(--pink-deep) inset;font-weight:700}
.custom-color{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;background:var(--chip);border-radius:14px}
.custom-color label{font-size:14px}
.custom-color input{width:44px;height:34px;border:0;padding:0;background:none;border-radius:8px}
.menu-sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.1)}
.bacts button.bl{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pk-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.pk-head img{height:30px;max-width:70px;object-fit:contain}
.pk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:70px}
.pk-card{position:relative;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 4px 5px;text-align:left;display:flex;flex-direction:column;gap:4px}
.pk-card .card.missing{opacity:1;filter:none}
.pk-card .rar,.pk-card .qty{display:none}
.pk-card[aria-pressed="true"]{border-color:var(--pink-deep);background:var(--chip)}
.pk-check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--pink-deep);color:#fff;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.pk-cap{font-size:10.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.pk-cap b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-other{font-size:10px;color:var(--ink-soft);background:var(--chip);border-radius:5px;padding:1px 4px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -18px calc(-20px - env(safe-area-inset-bottom,0px));padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.sign{position:absolute;left:6px;bottom:28px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1;color:#fff;background:linear-gradient(135deg,#FFD66B,#F5A623);box-shadow:0 0 0 2px #fff,0 1px 3px rgba(0,0,0,.25)}
.n3 .sign{width:18px;height:18px;font-size:11px;left:4px;bottom:22px}
.n4 .sign{width:14px;height:14px;font-size:9px;left:3px;bottom:3px;box-shadow:0 0 0 1px #fff}
.detail-top .sign,.side .sign{width:26px;height:26px;font-size:15px;bottom:8px;left:8px}
.pk-card .sign{bottom:6px;left:6px;width:18px;height:18px;font-size:11px}
.tag.signtag{background:linear-gradient(135deg,#FFE9A8,#FFD27A);color:#8A5A00;font-weight:700}
.chip.starchip[aria-pressed="true"]{background:linear-gradient(135deg,#FFD66B,#F5A623);border-color:#F5A623;color:#5A3A00;font-weight:700}
.bk-switch{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:14px;cursor:pointer}
.bk-switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw-track{flex:0 0 42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.sw-track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.bk-switch input:checked + .sw-track{background:var(--accent)}
.bk-switch input:checked + .sw-track::after{left:21px}
.bk-switch input:focus-visible + .sw-track{outline:3px solid var(--accent);outline-offset:2px}
.jname{margin:-2px 0 4px 42px;font-size:13px;color:var(--ink-soft);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",var(--body)}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px}
.navb{width:44px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:24px;line-height:1;color:var(--pink-deep)}
.navb:disabled{opacity:.3}
.navpos{font-size:13px;color:var(--ink-soft)}
.heart{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:22px;line-height:1;color:#E0457B;display:grid;place-items:center;padding:0}
.heart[aria-pressed="true"]{background:#FFE3EC;border-color:#F59AB8}
.chip.wantchip[aria-pressed="true"]{background:#E0457B;border-color:#E0457B;color:#fff}
@keyframes slideL{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
.slide-l .sides,.slide-l .detail-top{animation:slideL .22s ease}
.slide-r .sides,.slide-r .detail-top{animation:slideR .22s ease}
@media (prefers-reduced-motion:reduce){.slide-l .sides,.slide-r .sides,.slide-l .detail-top,.slide-r .detail-top{animation:none}}
.side{position:relative}
.wheart{position:absolute;z-index:2;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:#fff;color:#E0457B;font-size:13px;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 1.5px #F59AB8,0 1px 2px rgba(0,0,0,.2)}
.wheart.low{top:40px}
.n3 .wheart{width:16px;height:16px;font-size:10px;top:8px;right:8px}.n3 .wheart.low{top:28px}
.n4 .wheart{width:12px;height:12px;font-size:8px;top:6px;right:6px;box-shadow:0 0 0 1px #F59AB8}.n4 .wheart.low{top:21px}
.side .wheart{width:26px;height:26px;font-size:15px;top:8px;right:8px}.side .wheart.low{top:40px}
.coord .mini-card .wheart,.pk-card .wheart{display:none}
.memo.mine{background:#fff;border:1.5px dashed var(--pocket-edge)}
.sign{display:none!important}
.memo{background:var(--chip);border-radius:14px;padding:10px 14px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.memo .label{margin-bottom:2px}
.pageno{text-align:right;font-size:13px;color:var(--ink-soft);margin:6px 18px 0}

.pocket{position:relative;border:1px solid var(--pocket-edge);background:var(--pocket);border-radius:9px;padding:6px;display:block;width:100%;text-align:left}
.pocket::after{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;
  background:linear-gradient(125deg,var(--sheen) 0%,transparent 32%,transparent 70%,rgba(255,255,255,.18) 100%)}
.pocket.slot{aspect-ratio:63/88;padding:0;cursor:default}
.card{position:relative;aspect-ratio:63/88;border-radius:5px;overflow:hidden;transition:opacity .25s,filter .25s,transform .15s}
.card.missing{opacity:.38;filter:saturate(.35)}
.pocket:active .card{transform:scale(.97)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.art{width:100%;height:100%;display:grid;place-items:center;position:relative}
.art svg{width:66%;height:auto;overflow:visible}
.art .outline{fill:#fff;stroke:#fff;stroke-width:10;stroke-linejoin:round}
.art .body{fill:#fff;stroke:var(--tc);stroke-width:3.6;stroke-linejoin:round}
.art svg{filter:drop-shadow(0 1px 1.5px color-mix(in srgb,var(--tc) 35%,transparent))}
.t-lovely{--tc:#E0689A;background:radial-gradient(80% 60% at 20% 10%,rgba(255,255,255,.7),transparent 60%),linear-gradient(160deg,#FFE0EA,#F7AFC7)}
.t-cool{--tc:#3F97D6;background:radial-gradient(80% 60% at 20% 10%,rgba(255,255,255,.7),transparent 60%),linear-gradient(160deg,#E0F2FF,#A6D6F5)}
.t-sexy{--tc:#8E6AD8;background:radial-gradient(80% 60% at 20% 10%,rgba(255,255,255,.7),transparent 60%),linear-gradient(160deg,#EDE4FF,#C4AEF2)}
.t-pop{--tc:#EC8340;background:radial-gradient(80% 60% at 20% 10%,rgba(255,255,255,.7),transparent 60%),linear-gradient(160deg,#FFE9D3,#FFBF8E)}
.t-none{--tc:#B58497;background:radial-gradient(80% 60% at 20% 10%,rgba(255,255,255,.7),transparent 60%),linear-gradient(160deg,#FFF6F9,#EAD9E0)}
.pocket.ty-lovely{border:2px solid #F4A6C2}
.pocket.ty-cool{border:2px solid #92CBF0}
.pocket.ty-sexy{border:2px solid #BCA3EE}
.pocket.ty-pop{border:2px solid #F8B584}
.n4 .pocket[class*="ty-"]{border-width:1.5px}
.tag.tt-lovely{background:#FFE0EA;color:#B03D6B}.tag.tt-cool{background:#E0F2FF;color:#236FA6}
.tag.tt-sexy{background:#EDE4FF;color:#6444B0}.tag.tt-pop{background:#FFE9D3;color:#B35A1D}
.cap{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:13px;line-height:1.25;color:#2B2238;
  background:linear-gradient(to top,rgba(255,255,255,.92),rgba(255,255,255,0));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card img + .cap{color:#2B2238}
.rar{position:absolute;top:6px;left:6px;font-family:var(--display);font-size:13px;line-height:1;padding:4px 7px 3px;border-radius:5px;color:#fff;letter-spacing:.3px}
.r-ER{background:conic-gradient(from 200deg,#FF6FB5,#FFC75F,#6EE0FF,#B98CFF,#FF6FB5);color:#2B1440;text-shadow:0 0 2px rgba(255,255,255,.8)}
.r-PR{background:linear-gradient(135deg,#E8679A,#B774E8)}
.r-R{background:#2F8FDB}
.r-N{background:#A8939C}

<script>
(function(){
"use strict";
const RAR = {ER:"ER 앙코르 레어",PR:"PR 프리미엄 레어",R:"R 레어",N:"N 노멀"};
const RAR_ORDER = ["ER","PR","R","N"];
const SRC = {arcade:"게임기체",promo:"프로모션"};
const SRC_ORDER = ["arcade","promo"];
const PART = {top:"상의",bottom:"하의",dress:"원피스",full:"풀코디",shoes:"슈즈",acc:"헤어 악세사리"};
const PART_ORDER = ["top","bottom","dress","full","shoes","acc"];
const TYPE = {lovely:"큐트",cool:"쿨",sexy:"섹시",pop:"팝"};
const TYPE_ORDER = ["lovely","cool","sexy","pop"];
const DIMS = ["dan","rarity","type","brand","source","part"];
let TAB_COLORS = ["#F5A7C0","#E06A94","#FFC4D4","#EE89AB","#F9B8CB","#D65E8A"];
/* ---------- theme ---------- */
const THEME_DEFAULT="#F5A7C0";
const THEME_PRESETS=[["연분홍","#F5A7C0"],["라벤더","#C9B3F2"],["하늘","#A6D2F2"],["민트","#9ED9C3"],["피치","#FFBE9A"],["레몬","#F2D675"],["코랄","#F7A09A"],["실버","#C8C3CF"]];
function hexToHsl(hex){let m=String(hex).replace("#","");if(m.length===3)m=m.split("").map(x=>x+x).join("");
  const r=parseInt(m.slice(0,2),16)/255,g=parseInt(m.slice(2,4),16)/255,b=parseInt(m.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,sat=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;sat=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return [Math.round(h),Math.round(sat*100),Math.round(l*100)]}
function hsl(h,s,l){return `hsl(${h} ${Math.max(0,Math.min(100,s))}% ${Math.max(0,Math.min(100,l))}%)`}

  if(!/^#[0-9a-f]{6}$/i.test(hex||""))hex=THEME_DEFAULT;
  const [h,s0]=hexToHsl(hex); const s=Math.max(12,Math.min(85,s0));
  const warmY=h>=40&&h<=95; const aL=warmY?46:60;
  const light=`--ink:${hsl(h,32,20)};--ink-soft:${hsl(h,18,44)};--cover-hi:${hsl(h,Math.min(100,s+20),95)};--cover:${hsl(h,Math.min(100,s+15),91)};--cover-2:${hsl(h,s,80)};--cover-ink:${hsl(h,35,26)};--cover-soft:${hsl(h,28,40)};
    --pink:${hsl(h,s,80)};--pink-deep:${hsl(h,Math.min(70,s),warmY?40:56)};--toast:${hsl(h,Math.min(70,s),warmY?38:56)};
    --bg:${hsl(h,Math.min(100,s+30),97)};--pocket:${hsl(h,Math.min(100,s+30),98.5)};--pocket-edge:${hsl(h,Math.min(80,s),88)};
    --hole:${hsl(h,Math.min(90,s+10),92)};--line:${hsl(h,Math.min(80,s),92)};--accent:${hsl(h,Math.min(72,s+5),aL)};
    --chip:${hsl(h,Math.min(90,s+10),95)};--chip-on:${hsl(h,Math.min(72,s+5),aL)};`;
  const dark=`--bg:${hsl(h,22,10)};--paper:${hsl(h,20,14)};--ink:${hsl(h,60,95)};--ink-soft:${hsl(h,25,72)};
    --pocket:${hsl(h,18,18)};--pocket-edge:${hsl(h,20,27)};--hole:${hsl(h,22,10)};--line:${hsl(h,18,23)};
    --chip:${hsl(h,18,20)};--chip-on:${hsl(h,s,80)};--chip-on-ink:${hsl(h,40,18)};`;
  $("#themeStyle").textContent=`:root{${light}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${dark}}}
:root[data-theme="dark"]{${dark}}
.ribbon span{background:#fff}`;
  TAB_COLORS=[hsl(h,s,80),hsl(h,Math.min(72,s+5),aL),hsl(h,s,86),hsl(h,s,70),hsl(h,s,83),hsl(h,Math.min(70,s),warmY?40:56)];
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute("content",hexOf(h,Math.min(100,s+15),91));
}
function hexOf(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return "#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
const SHAPE = {
  dress:["M25 9 Q32 14.5 39 9 L47.5 12.5 L53 23 L45.5 26.5 L43.5 23.5 L41.5 33 L49 52 Q32 57.5 15 52 L22.5 33 L20.5 23.5 L18.5 26.5 L11 23 L16.5 12.5 Z","nonzero",1],
  top:["M24 11 Q32 17 40 11 L50 15 L56.5 27 L47.5 31 L45.5 27.5 L45.5 54 L18.5 54 L18.5 27.5 L16.5 31 L7.5 27 L14 15 Z","nonzero",1],
  bottom:["M21.5 9 H42.5 Q44.5 9 44.5 11 V17.5 Q44.5 19.5 42.5 19.5 H21.5 Q19.5 19.5 19.5 17.5 V11 Q19.5 9 21.5 9 Z M21 22.5 H43 L51 49 Q32 55 13 49 Z","nonzero",1],
  shoes:["M23.5 7 H38.5 Q39.5 7 39.5 8.5 L38 38.5 Q38 43 43 45 L50 47.5 Q55 49.5 54 55 L33 55 Q31.5 51 29.5 51 L28.5 56 L25 56 Q24 46 22.5 30 Q22 18 23.5 7 Z","nonzero",0],
  full:["M21 13 L20 5 L25.5 8.5 L28.5 3 L32 6.5 L35.5 3 L38.5 8.5 L44 5 L43 13 Z M25.5 17.5 Q32 20.5 38.5 17.5 L39.5 26 L50.5 38.5 Q32 44 13.5 38.5 L24.5 26 Z M21.5 48 Q26.5 45.5 30 48.5 L30 56.5 Q26 59.5 21.5 56.5 Z M42.5 48 Q37.5 45.5 34 48.5 L34 56.5 Q38 59.5 42.5 56.5 Z","nonzero",0,"M32 24.5 L26.5 20.5 Q25.5 24.5 26.5 28.5 Z M32 24.5 L37.5 20.5 Q38.5 24.5 37.5 28.5 Z M32 24.5 m-2.3 0 a2.3 2.3 0 1 0 4.6 0 a2.3 2.3 0 1 0 -4.6 0 Z"],
  acc:["M25.5 6 H38.5 L43 12 L38.5 18 H25.5 L21 12 Z M32 22 A16.5 16.5 0 1 1 31.99 22 Z M32 28 A10.5 10.5 0 1 0 32.01 28 Z","evenodd",0]
};
function iconSVG(part,type){const sh=SHAPE[part];if(!sh)return "";const [d,r,,deco]=sh;
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><path class="outline" d="${d}" fill-rule="${r}"/><path class="body" d="${d}" fill-rule="${r}"/>${deco?`<path class="deco" d="${deco}"/>`:""}</svg>`}

const S = {want:{},navOrder:[],theme:THEME_DEFAULT,search:"",cards:[],qty:{},photos:{},brands:[],cols:2,groupBy:"dan",own:"all",f:{want:[],sign:[],dan:[],rarity:[],type:[],brand:[],source:[],part:[]},quick:false,loading:true,
  last:{dan:"",rarity:"N",type:"lovely",source:"arcade",part:"top"}};
let backend = {kind:"none"}, assets = null;

/* ---------- prefs (per-viewer convenience) ---------- */
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem("binder-prefs")||"null");if(p){
  if(p.theme)S.theme=p.theme; if(typeof p.bkPhotos==="boolean")S.bkPhotos=p.bkPhotos;
  if(DIMS.includes(p.groupBy))S.groupBy=p.groupBy; if([2,3,4].includes(p.cols))S.cols=p.cols; if(["all","have","need"].includes(p.own))S.own=p.own;
  if(p.f)DIMS.concat(["sign","want"]).forEach(d=>{if(Array.isArray(p.f[d]))S.f[d]=p.f[d]}); S.f.sign=S.f.sign.filter(v=>v==="star"); if(p.last)Object.assign(S.last,p.last);}}catch(e){}}
function savePrefs(){try{localStorage.setItem("binder-prefs",JSON.stringify({bkPhotos:!!S.bkPhotos,theme:S.theme,cols:S.cols,groupBy:S.groupBy,own:S.own,f:S.f,last:S.last}))}catch(e){}}

/* ---------- storage ---------- */
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("binder-data")||"null");if(d){S.cards=(d.cards||[]).map(normCard);S.qty=d.qty||{};S.want=d.want||{};S.brands=d.brands||[];S.seedVer=d.seedVer||0;S.syncIds=d.syncIds||null;S.syncStamp=d.syncStamp||"";S.syncVer=d.syncVer||""}}catch(e){}
}
function saveLocal(){try{localStorage.setItem("binder-data",JSON.stringify({cards:S.cards,qty:S.qty,want:cleanWant(),brands:S.brands,seedVer:S.seedVer||0,syncIds:S.syncIds||null,syncStamp:S.syncStamp||"",syncVer:S.syncVer||""}))}catch(e){toast("이 기기에 저장하지 못했어요")}}
const timers={cat:null,own:null,brand:null,set:null}, inflight={cat:false,own:false,brand:false,set:false}, again={cat:false,own:false,brand:false,set:false};
function isPending(w){return !!timers[w]||inflight[w]}
function scheduleSave(w){
  if(backend.kind!=="db"){saveLocal();return}
  clearTimeout(timers[w]); timers[w]=setTimeout(()=>{timers[w]=null;flush(w)},450);
}
async function flush(w){
  if(inflight[w]){again[w]=true;return}
  inflight[w]=true;
  const ref = w==="cat"?backend.catRef:w==="brand"?backend.brandRef:w==="set"?backend.setRef:backend.ownRef;
  const data = w==="cat"?{cards:S.cards}:w==="brand"?{brands:S.brands}:w==="set"?{theme:S.theme}:{qty:cleanQty(),want:cleanWant()};
  try{await ref.set(JSON.parse(JSON.stringify(data)))}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await ref.set(JSON.parse(JSON.stringify(data)))}catch(e2){toast("저장하지 못했어요. 연결을 확인하고 다시 눌러 주세요")}}
    else if(e&&e.code==="quota_exceeded")toast("저장 공간이 가득 찼어요");
    else {S.readOnly=true;render();toast("이 계정은 보기 권한만 있어서 저장되지 않았어요")}
  }
  inflight[w]=false;
  if(again[w]){again[w]=false;flush(w)}
}
function cleanWant(){const o={};for(const k in S.want){if(S.want[k])o[k]=true}return o}
function cleanQty(){const o={};for(const k in S.qty){if(S.qty[k]>0)o[k]=S.qty[k]}return o}

/* ---------- photo store (IndexedDB) ---------- */
let idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise((res,rej)=>{const r=indexedDB.open("encore-binder",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbP}
function idbRun(fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("photos","readwrite");fn(tx.objectStore("photos"));
  tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}))}
function idbAll(){return idb().then(db=>new Promise((res,rej)=>{const out={};const tx=db.transaction("photos","readonly");
  const rq=tx.objectStore("photos").openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}};
  tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error)}))}
let savedPhotos={}, photoChain=Promise.resolve();
function saveLocalPhotos(){
  const cur=Object.assign({},S.photos), put=[], del=[];
  for(const k in cur)if(savedPhotos[k]!==cur[k])put.push(k);
  for(const k in savedPhotos)if(!(k in cur))del.push(k);
  if(!put.length&&!del.length)return;
  photoChain=photoChain.then(()=>idbRun(st=>{put.forEach(k=>st.put(cur[k],k));del.forEach(k=>st.delete(k))}))
    .then(()=>{put.forEach(k=>savedPhotos[k]=cur[k]);del.forEach(k=>delete savedPhotos[k])})
    .catch(()=>toast("휴대폰 저장 공간이 부족해서 사진을 저장하지 못했어요"));
}

function baseNo(no){return String(no||"").trim().replace(/\s*(ER|PR|R|N)$/i,"").replace(/^(EP|E|P)\s*/i,"")}
const starFirst=(a,b)=>(b.star?1:0)-(a.star?1:0);
function blockSorter(list){const mn={};list.forEach(c=>{if(c.coord){const k=c.coord;if(!(k in mn)||cmp(c.no||c.name,mn[k])<0)mn[k]=c.no||c.name}});
  const bk=c=>c.coord?mn[c.coord]:(c.no||c.name);
  return (a,b)=>cmp(bk(a),bk(b))||cmp(a.coord||"",b.coord||"")||starFirst(a,b)||cmp(a.no||a.name,b.no||b.name)}
function dispNo(c){return c&&c.no?c.no+" "+(RAR[c.rarity]?c.rarity:"")+(c.star?"★":""):""}
function normCard(c){if(c&&c.no){const n=fmtNo(c.no,c.source);if(n!==c.no)c.no=n}return c}
const brandById=id=>S.brands.find(b=>b.id===id);
const logoOf=id=>S.photos["logo-"+id]||"";
function label(dim,v){if(dim==="coord")return v==="__nocoord"?"코디 미정":v;if(dim==="brand"){const b=brandById(v);return b?b.name:"브랜드 미정"}if(dim==="dan"&&v==="__promo")return "프로모션";if(dim==="type")return TYPE[v]||"타입 미정";if(dim==="rarity")return RAR[v]||v;if(dim==="source")return SRC[v]||v;if(dim==="part")return PART[v]||v;return v||"탄 미정"}
function orderKeys(dim,keys){
  const ord=dim==="brand"?S.brands.map(b=>b.id):dim==="type"?TYPE_ORDER:dim==="rarity"?RAR_ORDER:dim==="source"?SRC_ORDER:dim==="part"?PART_ORDER:null;
  const ix=k=>{const i=ord.indexOf(k);return i<0?99:i};
  if(ord)return keys.sort((a,b)=>ix(a)-ix(b));
  const pr=k=>k==="__promo"||k==="__nocoord"?2:k===""?1:0;
  return keys.sort((a,b)=>pr(a)-pr(b)||cmp(a,b));
}

function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej({code:"load"})};img.src=url})}
function toCanvas(img,max,rot,noFill){const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");
  const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
  cv.width=rot?h:w;cv.height=rot?w:h;const g=cv.getContext("2d");
  if(!noFill){g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height)}
  if(rot){g.translate(cv.width,0);g.rotate(Math.PI/2)}
  g.drawImage(img,0,0,w,h);return cv}
async function encodeBlob(img,rot){const cv=toCanvas(img,800,rot);return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej({code:"encode"}),"image/jpeg",.86))}
function encodeDataURL(img,rot){let max=640,qual=.82,url="";for(let i=0;i<6;i++){url=toCanvas(img,max,rot).toDataURL("image/jpeg",qual);if(url.length<190000)return url;max=Math.round(max*.8);qual=Math.max(.6,qual-.06)}return url}
async function removePhotoDoc(id){if(!S.photos[id])return;delete S.photos[id];
  if(backend.kind==="db"){try{await backend.db.doc("photos/"+id).delete()}catch(e){}}else{try{saveLocalPhotos()}catch(e){}}}
async function storePhoto(c,file,side){
  const img=await loadImg(file);
  const rot=c.part==="acc";
  if(side==="b"){const src=encodeDataURL(img,rot);if(backend.kind==="db")await backend.db.doc("photos/"+c.id+"-b").set({src});S.photos[c.id+"-b"]=src;if(backend.kind!=="db"&&typeof saveLocalPhotos==="function")saveLocalPhotos();return}
  if(assets){
    try{const r=await assets.upload(await encodeBlob(img,rot),{type:"image/jpeg"});
      const old=c.photo;c.photo=r.id;if(old&&old!==r.id)assets.delete(old).catch(()=>{});
      await removePhotoDoc(c.id);return;
    }catch(err){if(err&&err.code==="quota_exceeded")throw err;}
  }
  const src=encodeDataURL(img,rot);
  if(backend.kind==="db")await backend.db.doc("photos/"+c.id).set({src});
  S.photos[c.id]=src; if(backend.kind!=="db")saveLocalPhotos();
  if(c.photo){const old=c.photo;delete c.photo;if(assets)assets.delete(old).catch(()=>{})}
}
function photoErr(err){const k=err&&err.code;

function fileKey(s){return String(s||"").normalize("NFC").replace(/\.[^.]+$/,"").trim().toLowerCase().replace(/[\s_]+/g,"-")}
$("#bulkInput").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length)return;

  S.cards.forEach(c=>{const M=c.star?byStar:byNo;if(c.no){M[fileKey(c.no)]=c;M[fileKey(dispNo(c))]=c;if(!M[fileKey(baseNo(c.no))])M[fileKey(baseNo(c.no))]=c} if(!c.star||!byName[fileKey(c.name)])byName[fileKey(c.name)]=c});

function norm(s){return String(s||"").replace(/\s+/g,"").toLowerCase()}
function mapRarity(s){s=norm(s);if(/^(er|앙코르레어|앙코르|encore)/.test(s))return "ER";if(/^(pr|프리미엄레어|프리미엄|premium)/.test(s))return "PR";if(/^(r|레어|rare|r레어)$/.test(s))return "R";if(/^(n|노멀|노말|normal|n노멀|n노말)$/.test(s))return "N";return null}
function mapSource(s){s=norm(s);if(/게임|기체|arcade|배출/.test(s))return "arcade";if(/프로모|promo|특전/.test(s))return "promo";return null}
function mapType(s){s=norm(s);if(/러블리|lovely|큐트|cute/.test(s))return "lovely";if(/쿨|cool/.test(s))return "cool";if(/섹시|sexy/.test(s))return "sexy";if(/팝|pop/.test(s))return "pop";return ""}
function mapPart(s){s=norm(s);if(/풀코디|풀|full/.test(s))return "full";if(/원피스|one|dress/.test(s))return "dress";if(/상의|탑|top/.test(s))return "top";if(/하의|보텀|바텀|bottom|스커트|팬츠/.test(s))return "bottom";if(/슈즈|신발|shoe/.test(s))return "shoes";if(/악세|액세|헤어|acc/.test(s))return "acc";return null}
function parseImport(text){
  const rows=[],bad=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim())return; const c=line.includes("\t")?line.split("\t"):line.split(",");
    const cell=k=>(c[k]||"").trim();
    if(i===0&&/번호|이름/.test(cell(0)+cell(1)))return;
    const star=/★|싸인|패러렐/.test(cell(0));
    const r={star,no:cell(0).replace(/★|싸인|패러렐/g,"").trim(),name:cell(1),dan:cell(2),rarity:mapRarity(cell(3)),type:mapType(cell(4)),brandName:cell(5),source:mapSource(cell(6)),part:mapPart(cell(7)),coord:cell(8),qty:parseInt(cell(9),10)||0,memo:c.slice(10).join(line.includes("\t")?" ":",").trim()};
    if(!r.name||!r.rarity||!r.source||!r.part){bad.push(i+1);return} rows.push(r);
  });
  return {rows,bad};
}
function doImport(){
  const {rows}=parseImport($("#impText").value); let added=0,updated=0,newBrand=false;
  rows.forEach(r=>{
    r.no=fmtNo(r.no,r.source);
    const ex=r.no?S.cards.find(c=>!!c.star===r.star&&(c.no===r.no||baseNo(c.no)===baseNo(r.no)&&c.source===r.source)):null;
    const data={no:r.no,name:r.name,dan:r.dan,rarity:r.rarity,source:r.source,part:r.part}; if(r.star)data.star=true; if(r.type)data.type=r.type; if(r.brandName){let b=S.brands.find(x=>norm(x.name)===norm(r.brandName));if(!b){b={id:"b"+uid().slice(1),name:r.brandName};S.brands.push(b);newBrand=true}data.brand=b.id} if(r.coord)data.coord=r.coord; if(r.memo)data.memo=r.memo;
    let id; if(ex){Object.assign(ex,data);if(!r.star)delete ex.star; if(!r.type)delete ex.type; if(!r.brandName)delete ex.brand; if(!r.coord)delete ex.coord; if(!r.memo)delete ex.memo;id=ex.id;updated++} else {id=uid();S.cards.push({id,...data});added++}
    if(r.qty>0)S.qty[id]=Math.min(99,r.qty);
  });
  scheduleSave("cat"); scheduleSave("own"); if(newBrand)scheduleSave("brand"); render(); dMore.close();
  toast(`새 카드 ${added}장을 추가했어요`+(updated?` (기존 카드 ${updated}장은 정보를 고쳤어요)`:""));
}

    if(a.dataset.act==="clear"){DIMS.forEach(d=>S.f[d]=[]);S.f.sign=[];S.f.want=[];S.own="all";S.search="";$("#searchIn").value="";savePrefs();render()}
    if(a.dataset.act==="sclear"){S.search="";$("#searchIn").value="";render()} return}
  const p=e.target.closest(".pocket[data-id]"); if(!p)return; const id=p.dataset.id, c=byId(id);
  if(S.quick){const before=q(id); setQty(id,before+1); toast(`${c.name} ${before+1}장`,"되돌리기",()=>setQty(id,before))}
  else openDetail(id);
});
document.querySelectorAll("dialog.sheet").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));

initBackend();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
